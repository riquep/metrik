[project]
name = "metrik-backend"
version = "0.1.0"
description = "Parsers de laudos de bioimpedância (isolado, sem dependências de app/DB)"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
