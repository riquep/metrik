[project]
name = "metrik-backend"
version = "0.1.0"
description = "Parsers de laudos de bioimpedância + modelo de dados multi-tenant"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "Pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "src.dev_harness.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
